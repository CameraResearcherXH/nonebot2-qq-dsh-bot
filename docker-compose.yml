# ============================================================
# 日志轮转（必须配，否则 json log 会无限增长把磁盘吃满）
#   每个容器最多 3 × 20MB = 60MB，超出自动删最老的
#   不配的话默认是「永不轮转」，跑几天就能到几个 G
# ============================================================
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  # 你的大肥鱼机器人
  bot:
    build: .
    container_name: qq-grok-bot
    restart: always
    # ⚠️ host 模式：容器直接用宿主机网络栈。
    #    所以 .env 里访问宿主机/隧道服务必须写 127.0.0.1，
    #    不能写 host.docker.internal（那是 bridge 模式专用的 DNS 名，
    #    host 模式下会报 "Name or service not known"）。
    #    · AGENT_BASE_URL=http://127.0.0.1:8001
    #    · LOCAL_LLM_URL=http://127.0.0.1:11434/v1/chat/completions
    network_mode: "host"
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
    logging: *default-logging
    volumes:
      - ./plugins:/app/plugins
      - ./services:/app/services     # 👈 新增：映射服务层
      # ⚠️ 2026-11-20：新增 core/ 内核层（tuning / pipeline / llm_gateway）。
      #    镜像里没有这个目录（镜像是加 core 之前构建的），不挂载的话
      #    `from core import tuning` 会直接 ImportError → 容器起不来。
      - ./core:/app/core
      # ⚠️ 2026-11-22：vendored 第三方库（PicImageSearch）。
      #    services 要 import 它，而 services 不能依赖 plugins，所以放根目录。
      - ./vendor:/app/vendor
      - ./bot.py:/app/bot.py         # 👈 新增：映射主入口
      - ./.env:/app/.env
      - ./data:/app/data
      - ./napcat/qq:/app/.config/QQ
      # 👇 只读挂 NapCat 的图片缓存：识图优先读原图（见 vision_agent._fetch_image_bytes）
      - ./napcat/cache:/app/napcat/cache:ro
      - ./scripts:/app/scripts        # 👈 排查脚本，改完不用再 docker cp
      # ⚠️ 2026-11-22：容器内自检要读文档 / 编排文件：
      #   · audit_third_party 会写 docs/third-party-audit.md
      #   · check_mounts 要读 docker-compose.yml（镜像里那份是旧的，会误报缺挂载）
      - ./docs:/app/docs
      - ./docker-compose.yml:/app/docker-compose.yml:ro
      # ⚠️ 2026-11-26：清单也要挂。它以前**不在挂载里**，容器里读到的是镜像里那份旧清单
      #   （52 条），`verify_deploy` 会报「52 个文件 / 一致 0」—— 2026-11-26 排查时被它误导过两次。
      - ./deploy_manifest.txt:/app/deploy_manifest.txt:ro

  # ============================================================
  # RSSHub（已移除，2026-11-13）
  #
  # 原来给 pixivrank 提供 RSS 源，现在用不上了：
  #   pixivrank 的排行改成直连 pixiv 网页版公开接口
  #     https://www.pixiv.net/ranking.php?mode=daily&format=json
  #   不需要登录态、不需要中转，一个容器省下 100MB+ 内存。
  #
  # 为什么不能继续用 RSSHub：
  #   RSSHub 的 /pixiv/* 只认 PIXIV_REFRESH_TOKEN（源码 lib/routes/pixiv/token.ts），
  #   而拿 token 的三条路全断了 ——
  #     · 账号密码授权被 pixiv 关闭：code 1508 "grant type is unauthorized"
  #     · PKCE 签发 code 的 /web/v1/users/auth/pixiv/start 接口 404 已下线
  #     · RSSHub 不支持 cookie 方案
  #   没有 token 时路由直接抛错，对外就是 503 + "Welcome to RSSHub!" 错误页。
  #
  # 代码里仍保留 RSSHub 作为**降级兜底**（pixivrank_search/data_source.py 的
  # parser_data），网页接口哪天挂了还能手动把这段加回来应急：
  #
  #  rsshub:
  #    image: diygod/rsshub:latest
  #    container_name: rsshub
  #    restart: always
  #    # ⚠️ 只绑 127.0.0.1，不要写 "1200:1200"：RSSHub 没有鉴权，
  #    #    绑 0.0.0.0 等于给全网开免费 RSS 代理，会被白嫖带宽甚至封 IP。
  #    ports:
  #      - "127.0.0.1:1200:1200"
  #    environment:
  #      TZ: Asia/Shanghai
  #      NODE_ENV: production
  #      CACHE_TYPE: memory
  #      CACHE_EXPIRE: 300
  #      PIXIV_REFRESH_TOKEN: ${PIXIV_REFRESH_TOKEN:-}
  #    logging: *default-logging
  # ============================================================

  # QQ 客户端 (NapCat)
  #
  # ⚠️ 2026-11-28：`mlikiowa/napcat-docker` 已从 Docker Hub 下架
  #   （连同 napcat-framework-docker / napcat-appimage / napcat-node 一起消失，
  #    NapNeko/NapCat-Docker 仓库也 404 了）。**本机已有镜像仍能正常运行**，
  #    只是「重新拉取 / 新机器部署」会失败。
  #
  #   所以这里做两件事：
  #     1) 镜像名改成变量，谁有可用的镜像源就在 .env 里写 NAPCAT_IMAGE=...；
  #     2) pull_policy: missing —— 本地有镜像就不去 pull，`up -d` 不会因为
  #        拉取失败把已经跑着的容器搞挂。
  #
  #   长期方案见 docs/deployment.md「NapCat 镜像下架」一节。
  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    pull_policy: missing
    container_name: napcat
    restart: always
    network_mode: "host"
    environment:
      TZ: "Asia/Shanghai"
      ACCOUNT: "${NAPCAT_ACCOUNT:-}"
      WEBUI_PORT: "6099"
      WEBUI_HOST: "0.0.0.0"
      # 👇 2026-11-24：腾讯老把快速登录 token 作废（「你的用户身份已失效」），
      #    没配密码就只能干等扫码。在 .env 里写 NAPCAT_QUICK_PASSWORD 后，
      #    掉线会自动用密码重登，不用再手动扫码。
      #    ⚠️ 只在 .env 里写，别提交到仓库；也可以只配 MD5（更安全）。
      NAPCAT_QUICK_PASSWORD: "${NAPCAT_QUICK_PASSWORD:-}"
      NAPCAT_QUICK_PASSWORD_MD5: "${NAPCAT_QUICK_PASSWORD_MD5:-}"
    logging: *default-logging
    volumes:
      - ./napcat/config:/app/napcat/config
      - ./napcat/qq:/app/.config/QQ
      # 👇 2026-11-24：把图片缓存也挂到宿主机，bot 容器只读挂同一份，
      #    这样识图能直接读 NapCat 缓存的**原图**（CDN 的 url 常是预览图，糊）。
      #    ⚠️ 改了这里要 `up -d --force-recreate napcat`，会重新登录（需扫码）。
      - ./napcat/cache:/app/napcat/cache
      - ./plugins:/app/plugins
      - ./.env:/app/.env
      - ./data:/app/data             # 让 NapCat 能读语音文件
